name: Build

# Verifies the template still builds and still obeys its own architecture rules.
# `archTest` runs FIRST on purpose: the checker takes seconds, the build takes
# minutes, and an architecture violation is worth failing fast on.
#
# Phase 0 of the roadmap extends this workflow (README badge, matrix); Phase 1
# added the archTest gate.

# Pull requests only — every change reaches `main` through a PR, so a push-to-main
# run would just rebuild an already-verified merge commit. Add `workflow_dispatch`
# if you ever need to re-run it against `main` by hand.
on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Proves the checker itself still works: every check fires on an injected
      # violation, and a rule-abiding fixture feature reports nothing.
      - name: Checker self-test
        run: python3 scripts/kmpilot_check_test.py

      # Adopt-mode compatibility matrix. Generates a scratch KMP project per
      # variant and asserts that `--adopt --dry-run` adopts, warns, or refuses
      # as documented in ADOPTING.md. Detection-only — pure bash, no Gradle — so
      # the whole matrix runs in seconds. It exists because a single happy-path
      # fixture hides the failures that matter: the first run of this matrix
      # found three silent `set -e` aborts on repos with no version catalog, no
      # matching plugin version, and no commonMain module.
      - name: Adopt compatibility matrix
        run: bash scripts/adopt-matrix.sh

      # Deterministic architecture checker — .claude/skills/_shared/kmpilot_check.py.
      # Fails the job on any error-severity violation of the mechanized rules.
      - name: Architecture rules (archTest)
        run: ./gradlew archTest --no-daemon

      - name: Upload architecture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-report
          path: .claude/docs/_project/check-report.json
          if-no-files-found: warn

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon
